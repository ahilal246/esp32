<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32 Camera</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      background: #f2f2f2;
      color: #222;
      text-align: center;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
    }

    /* Dark box that holds the video. The text shows until the first picture covers it. */
    .video {
      position: relative;
      aspect-ratio: 4 / 3;
      background: #111;
      color: #999;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    button {
      flex: 1;
      padding: 18px 0;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:active { opacity: 0.7; }
    #on  { background: #1a8f3c; }
    #off { background: #c62828; }

    #status {
      min-height: 1.5em;
      margin-top: 14px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <main>
    <div class="video">
      Waiting for camera...
      <img id="video" src="/video" alt="">
    </div>

    <div class="buttons">
      <button id="on">LED ON</button>
      <button id="off">LED OFF</button>
    </div>

    <p id="status"></p>
  </main>

  <script>
    const statusText = document.getElementById("status");
    const video = document.getElementById("video");

    // Send an LED request to the server and show the answer.
    async function led(path, method) {
      try {
        const answer = await fetch(path, { method: method });
        const text = await answer.text();
        statusText.textContent = answer.ok ? "LED is " + text.toUpperCase() : text;
      } catch (error) {
        statusText.textContent = "Server not reachable";
      }
    }

    document.getElementById("on").onclick  = () => led("/led/on", "POST");
    document.getElementById("off").onclick = () => led("/led/off", "POST");

    led("/led", "GET");   // show the current LED state when the page opens

    // If the video connection drops, connect again after 2 seconds.
    video.onerror = () => setTimeout(() => { video.src = "/video?" + Date.now(); }, 2000);
  </script>
</body>
</html>
